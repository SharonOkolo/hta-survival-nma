name: tests
on: [push, pull_request]
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - run: sudo apt-get update && sudo apt-get install -y jags libglpk-dev
      - run: Rscript -e 'install.packages(c("survival","flexsurv","netmeta","gemtc","rjags","testthat","ggplot2"))'
      - run: Rscript -e 'testthat::test_dir("tests/testthat", stop_on_failure = TRUE)'
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q tests/test_excel.py
